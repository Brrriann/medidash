# 홈쇼핑모아 방송 지표 하루 1회 수집.
#
# **왜 GitHub Actions인가**
# 크롤러가 순수 fetch라 브라우저가 필요 없고, 필요한 건 Supabase 키뿐이다.
# Cloudflare Cron Trigger로 옮기려면 크롤러를 Worker 번들에 넣어야 하는데
# workers/lib/env.ts가 node:fs를 쓰고, 87개 키워드를 매너 딜레이로 도는 5분짜리
# 루프라 Worker에 넣을 이유가 없다. 저장소가 이미 GitHub에 있으니 여기가 제일 싸다.
name: 홈쇼핑모아 지표 수집

on:
  schedule:
    # 20:00 UTC = 05:00 KST. 그날 방송 예정이 잡힌 뒤, 셀러가 보기 전에 채워둔다.
    - cron: "0 20 * * *"
  workflow_dispatch: # 수동 실행 (데이터 확인·재시도용)

# 앞 실행이 늦어지면 겹치지 않게 건너뛴다 — 같은 테이블에 동시 upsert할 이유가 없다.
concurrency:
  group: crawl-broadcast
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 정상 5분. 20분을 넘기면 상대 사이트가 응답을 안 하는 상황이라 끊는 게 맞다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 크롤러의 loadEnvFiles()는 .env.local / .env만 읽는다. Supabase URL·anon 키는
      # 이미 저장소에 있는 값이라(.env.production) 그대로 쓰고, 비밀은 아래 service role
      # 하나만 시크릿으로 받는다.
      - run: cp .env.production .env

      - name: 홈쇼핑모아 크롤
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl:broadcast
